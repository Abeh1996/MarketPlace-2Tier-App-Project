name: MarketPlace CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mapp-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mapp-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mapp-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mapp-frontend:${{ github.sha }}

  deploy-to-codespace:
    name: Deploy to Codespace
    needs: build-and-push
    runs-on: self-hosted

    env:
      DEPLOY_DIR: /workspaces/MarketPlace-2Tier-App-Project
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DEPLOY_DIR/docker-compose.yml"
          test -f "$DEPLOY_DIR/.env"
          echo "Deployment files found."

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull application images
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          IMAGE_TAG="$IMAGE_TAG" DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" \
            docker compose -p marketplace-2tier-app-project pull backend frontend

      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose -p marketplace-2tier-app-project up -d db

          for attempt in $(seq 1 30); do
            if docker compose -p marketplace-2tier-app-project \
              exec -T db pg_isready -U marketplace -d marketplace; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            echo "Waiting for PostgreSQL: ${attempt}/30"
            sleep 2
          done

          docker compose -p marketplace-2tier-app-project logs --tail=100 db
          exit 1

      - name: Apply Prisma migrations
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          IMAGE_TAG="$IMAGE_TAG" DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" \
            docker compose -p marketplace-2tier-app-project \
            run --rm backend npx prisma migrate deploy

      - name: Deploy backend and frontend
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          IMAGE_TAG="$IMAGE_TAG" DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" \
            docker compose -p marketplace-2tier-app-project \
            up -d backend frontend

      - name: Verify backend health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://localhost:4000/health; then
              echo
              echo "Backend health check passed."
              exit 0
            fi
            echo "Waiting for backend: ${attempt}/15"
            sleep 4
          done

          cd "$DEPLOY_DIR"
          docker compose -p marketplace-2tier-app-project logs --tail=100 backend
          exit 1
