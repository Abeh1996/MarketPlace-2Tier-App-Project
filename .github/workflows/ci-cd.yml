name: MarketPlace CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mapp-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mapp-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mapp-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mapp-frontend:${{ github.sha }}

  deploy-to-codespace:
    name: Start Containers in Codespace
    needs: build-and-push
    runs-on: self-hosted

    env:
      DEPLOY_DIR: /workspaces/MarketPlace-2Tier-App-Project
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Verify deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DEPLOY_DIR/docker-compose.yml"
          test -f "$DEPLOY_DIR/.env"
          echo "Deployment files found."

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull application images
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          IMAGE_TAG="$IMAGE_TAG" DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" \
            docker compose -p marketplace-2tier-app-project pull backend frontend

      - name: Start all three containers
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          IMAGE_TAG="$IMAGE_TAG" DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" \
            docker compose -p marketplace-2tier-app-project up -d db backend frontend

      - name: Show container status
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose -p marketplace-2tier-app-project ps

