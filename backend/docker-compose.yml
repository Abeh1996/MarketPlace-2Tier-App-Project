
services:
  db:
    image: postgres:16
    container_name: mappDB-container
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    networks:
      - mapp-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME:-abehdocker}/mapp-backend:${IMAGE_TAG:-latest}
    container_name: mapp-BE-container
    ports:
      - "4000:4000"
    environment:
      PORT: ${PORT:-4000}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mapp-network

  frontend:
    image: ${DOCKERHUB_USERNAME:-abehdocker}/mapp-frontend:${IMAGE_TAG:-latest}
    container_name: mapp-FE-container
    ports:
      - "5500:80"
    depends_on:
      - backend
    networks:
      - mapp-network

networks:
  mapp-network:
    driver: bridge

volumes:
  postgres-data:
