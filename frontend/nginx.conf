server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    # Serve frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward backend health request
    location /health {
        proxy_pass http://mapp-BE-container:4000;
    }

    # Forward backend API requests
    location /api/ {
        proxy_pass http://mapp-BE-container:4000;
    }
}